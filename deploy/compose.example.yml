# Spine's shared MCP server — an example to copy, not a production manifest.
# Put TLS in front (your proxy or ingress); the container speaks plain HTTP on 8080.
# Company-login settings go in spine.env (never in this file) — see deploy/README.md.
services:
  spine-mcp:
    image: ghcr.io/synaptixs/spine-mcp:3.66.0  # pin the version you tested
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # reached through the proxy, not directly
    env_file:
      - spine.env
    environment:
      ORCHESTRATOR_MCP_RESOURCE_URL: https://spine.example.internal/mcp
    volumes:
      - spine-data:/data
      - /srv/checkouts:/repos:ro
      - ./repos.yaml:/srv/spine/.spine/repos.yaml:ro
    read_only: true
    tmpfs:
      - /tmp

volumes:
  spine-data:
