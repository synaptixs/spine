repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.7]
        args: [--strict]
        files: ^(src|tests)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  # Secret scanning. Development moved directly onto this public repo, so there is
  # no longer a private staging repo whose publish DENY list could catch a leaked
  # credential on the way out — every push is publication. This is that safety net.
  # Known-dummy fixtures are allowlisted in .gitleaks.toml, matching the allowlist
  # the 'security scan' CI job already carries.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
