# Regenerate the committed knowledge base after a merge, where the tree is stable.
#
# `episteme/` is generated from the whole tracked tree — code *and* markdown, since doc
# ingestion turns every tracked .md into a Doc node. When branches carried it, every merge
# to develop stale-d every open PR against a tree that did not exist when they generated
# it, and CI checks the merge ref, so re-running never helped: only a rebase did. A
# documentation-only PR broke a code PR that shared no files with it.
#
# Moving regeneration here keeps everything that made committing the bank worthwhile — it
# stays readable in the repo, diffable per commit, and ingested as Doc nodes — while
# removing the conflict entirely. PRs are forbidden from touching it (see ci.yml).
name: Episteme

on:
  push:
    branches: [main, develop]

# One regeneration at a time per branch. Superseding an in-flight run is safe and correct:
# the output is a pure function of the tree, so the newest run computes the newest answer.
concurrency:
  group: episteme-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # A bot commit would re-trigger this workflow; the second run finds nothing to do and
    # exits without pushing, so it terminates either way. Skipping it outright keeps the
    # Actions log honest about what ran and why.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --extra dev

      - name: Regenerate
        run: uv run orchestrator understand .

      - name: Commit if it moved
        run: |
          if git diff --quiet -- episteme/; then
            echo "episteme is already current at $(git rev-parse --short HEAD)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episteme
          git commit -m "chore(episteme): regenerate for $(git rev-parse --short HEAD)

          Generated by .github/workflows/episteme.yml; the knowledge base is derived from
          the tree, not authored, and is regenerated after merge so branches never carry
          it and never conflict over it."
          # Another merge may have landed while this ran. Rebase rather than force: the
          # regeneration is reproducible, and clobbering someone else's merge is not.
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
