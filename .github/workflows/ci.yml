name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # JDK for the Java-codegen integration tests (Maven is pre-installed on the
      # runner). The tests skip cleanly when the toolchain is absent.
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # Node for the TypeScript-codegen integration tests (npm comes with Node).
      # The tests skip cleanly when the toolchain is absent.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      # `mcp` too, not just `dev`. Without it every MCP test skips, so a dependency bump
      # that breaks the client transport or the plugin server passes clean: the mcp 2.0.0
      # bump did exactly that, and the breakage — three renamed APIs — was only visible to
      # someone who had installed the extra locally. An optional extra the repo ships code
      # for is not optional to test.
      #
      # The six language extras, for the same reason and one sharper one. Without them only
      # `python` and `sql` front-ends register, so:
      #   * 89 tree-sitter tests skip — a tree-sitter API change lands green;
      #   * and `pkg accuracy` cannot score any corpus case for those languages. The
      #     TypeScript figures in the committed baseline were measured on a developer's
      #     machine and skipped by every CI run since, which means a TypeScript regression
      #     could not fail a build. A number nothing re-checks is not a gate.
      # Measured before adding: all 8 front-ends registered takes the suite from 2,747
      # passing / 25 skipped to 2,836 passing / 4 skipped, with no new failures, and this
      # repo's own graph is unchanged (it is pure Python outside the corpus fixtures).
      - name: Install project
        run: >-
          uv sync --extra dev --extra mcp
          --extra typescript --extra java --extra csharp
          --extra c --extra cpp --extra go

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      # README.md is the PyPI project page. PyPI serves it from pypi.org, so any
      # relative link/image 404s there — every reference must be an absolute URL.
      - name: README links absolute (relative paths 404 on PyPI)
        run: |
          fail=0
          if grep -nP '\]\((?!https?://|#|mailto:)[^)]+\)' README.md; then
            echo "::error file=README.md::Relative markdown link(s) above — use absolute https:// URLs (they 404 on PyPI)."
            fail=1
          fi
          if grep -nP 'src="(?!https?://)[^"]+"' README.md; then
            echo "::error file=README.md::Relative image src above — use an absolute raw.githubusercontent.com URL."
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "README link check passed."
          exit $fail

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      # Tier-1 graph invariants on our own repo. These are completeness checks — the
      # kind that catch a front-end silently *stopping* to resolve something, which a
      # does-it-run test passes straight through. The dangling-import bug lived for
      # eight releases behind 204 green tests because every assertion checked that an
      # edge was emitted with the expected text, and none checked that it resolved.
      - name: PKG invariants (orchestrator pkg verify)
        run: uv run orchestrator pkg verify .

      # The architecture diagram carries live numbers — version, command count, node and edge
      # kinds — and it is generated from them rather than drawn. The PNG this replaced was
      # stamped 3.8.4 and claimed `7 node kinds · 9 edge kinds` two releases after
      # ARCHITECTURE.md had corrected them to 8 and 11. Nothing noticed, because a picture is
      # the one artefact no test reads.
      - name: Architecture diagram is current
        run: uv run python scripts/render_architecture_svg.py --check

      # The capability matrix is a claim surface, and its headline count was the one number in
      # it nobody could re-run. On 2026-08-21 the matrix's own summary said 16 rows and
      # STATE-OF-SPINE.md said 11, for the same table on the same day; the answer was 22. Both
      # documents were warning, in their own text, about hand-authored matrices being wrong.
      # A number quoted to customers should fail a build when it drifts, not a meeting.
      - name: Capability matrix counts match the table
        run: uv run python scripts/matrix-count.py --check

      # Spine's own episteme has to describe Spine's own HEAD — but it is regenerated
      # *after* merge (.github/workflows/episteme.yml), not carried on branches. A PR
      # cannot keep it current: CI checks the merge ref, so the moment anything lands on
      # develop every open branch's committed bank is stale against a tree that did not
      # exist when it was generated. A docs-only PR broke a code PR that way, sharing no
      # files with it. Regeneration belongs where the tree is stable.
      #
      # What a PR still owes: the bank must *build*. This catches a change that makes
      # `understand` crash or emit nothing, which post-merge regeneration would otherwise
      # discover on develop.
      - name: Episteme builds (orchestrator understand .)
        run: uv run orchestrator understand .

      # And a PR must not carry the artifact. Two branches that both regenerate conflict on
      # every merge; that is the whole failure this design removes.
      #
      # Except when promoting develop to main. That PR's episteme/ diff is nothing *but*
      # this design working: every one of those commits is the bot's, made on develop after
      # a merge, and the two-dot diff against a main that is behind shows all of them at
      # once. The guard asks "did a contributor carry the artifact?" — on a promotion the
      # answer is structurally no, and there is no way to make it pass without reverting
      # the bank main is owed. Since 3.20.0 regeneration runs on develop only, so a
      # promotion is the *sole* way main's bank moves — see .github/workflows/episteme.yml.
      - name: PR does not modify episteme/
        if: github.event_name == 'pull_request' && github.base_ref != 'main'
        run: |
          # Two-dot, against a freshly fetched base: the question is whether this branch's
          # committed bank differs from the base's, which is answerable in a shallow clone.
          # A merge base is neither available nor needed.
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if ! git diff --quiet FETCH_HEAD HEAD -- episteme/; then
            echo "::error::This PR modifies episteme/, which is regenerated after merge."
            echo "Drop those files:  git checkout FETCH_HEAD -- episteme/"
            echo "See .github/workflows/episteme.yml and CONTRIBUTING.md."
            git diff --stat FETCH_HEAD HEAD -- episteme/
            exit 1
          fi
