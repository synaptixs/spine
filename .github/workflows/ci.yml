name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # JDK for the Java-codegen integration tests (Maven is pre-installed on the
      # runner). The tests skip cleanly when the toolchain is absent.
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      # Node for the TypeScript-codegen integration tests (npm comes with Node).
      # The tests skip cleanly when the toolchain is absent.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Install project
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      # README.md is the PyPI project page. PyPI serves it from pypi.org, so any
      # relative link/image 404s there — every reference must be an absolute URL.
      - name: README links absolute (relative paths 404 on PyPI)
        run: |
          fail=0
          if grep -nP '\]\((?!https?://|#|mailto:)[^)]+\)' README.md; then
            echo "::error file=README.md::Relative markdown link(s) above — use absolute https:// URLs (they 404 on PyPI)."
            fail=1
          fi
          if grep -nP 'src="(?!https?://)[^"]+"' README.md; then
            echo "::error file=README.md::Relative image src above — use an absolute raw.githubusercontent.com URL."
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "README link check passed."
          exit $fail

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      # Tier-1 graph invariants on our own repo. These are completeness checks — the
      # kind that catch a front-end silently *stopping* to resolve something, which a
      # does-it-run test passes straight through. The dangling-import bug lived for
      # eight releases behind 204 green tests because every assertion checked that an
      # edge was emitted with the expected text, and none checked that it resolved.
      - name: PKG invariants (orchestrator pkg verify)
        run: uv run orchestrator pkg verify .

      # Spine's own episteme has to describe Spine's own HEAD. The product's flagship
      # claim is detecting when docs drift from code; a knowledge base that drifts
      # silently in our own repo is the one failure we cannot ship.
      - name: Episteme is current (orchestrator understand --check)
        run: uv run orchestrator understand . --check
