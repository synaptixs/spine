name: CodeQL

# Dataflow SAST — the analysis `ruff --select S` can't do. Where the lint rules ask
# "does this line look risky?", CodeQL asks "does untrusted input reach this sink?",
# which is the question that matters wherever caller-supplied input reaches a
# network call, a response header, or a hand-written renderer.
#
# (This deliberately does not enumerate the specific surfaces or name the internal
# review that tracks them: a public list of where a project believes it is weakest
# is a starting point for someone probing it. The queries cover the codebase either
# way — the comment is orientation, not a checklist.)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly. CodeQL ships new queries continuously, so a tree that was clean at
    # merge time can turn up findings later with no code change.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # CodeQL uploads results to the Security tab, which needs code scanning enabled —
    # free on public repos, but requires GitHub Advanced Security on private ones. The
    # public repo (synaptixs/spine) is where releases and the security messaging live and
    # where scanning is available; on a private working fork the upload fails and would
    # block CI for no code reason. Run only where results can actually be surfaced.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers web/static — 2,378 lines of vanilla JS with
        # no build step and no framework auto-escaping, so the renderers there are
        # exactly where an XSS would live.
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          # `languages`, PLURAL. The input was `language` until the corpus landed, and
          # codeql-action silently ignores an unrecognised input — so the matrix value was
          # never applied and CodeQL autodetected instead. That was invisible while the repo
          # held only Python and JavaScript, because autodetection produced the same answer
          # the matrix intended. Adding C#, Java, C, C++ and Go fixtures made it produce a
          # different one: it set up tracing for all four compiled languages
          # (CODEQL_TRACER_LANGUAGES: cpp:csharp:go:java), found no C# to build, and failed
          # the run. The matrix was decorative for as long as it agreed with the guess.
          languages: ${{ matrix.language }}
          # Query selection lives in the config file, not here — it also carries the
          # query-filters that drop two quality queries which can't read typed-Python
          # idiom. Setting `queries:` here as well would ADD to the config, not replace it.
          config-file: .github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
