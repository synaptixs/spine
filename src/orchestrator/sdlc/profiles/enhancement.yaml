# The enhancement profile — the same pipeline, minus the research an enhancement cannot use.
#
# `n_rca` is absent, and that is the whole point of this file. Root-cause analysis localizes a
# *symptom*; a feature request has none, so `localize_trace` resolves nothing and the report says
# "Not localized to a repo symbol" — an empty section that reads as a finding and is not one.
#
# Dropping the node used to drop `build_rca`'s `git log` recency pass with it. That question —
# is this area actively changing? — is not symptom-dependent, so it comes back as `n_churn`
# below, over the landing sites.
#
# So an enhancement's evidence records that RCA was **not run for this issue type**, which is a
# different statement from "we ran it and found nothing", and the honest one.
#
# `sdlc autorun` executes this. Its `tool` nodes run through the tool registry and compose the
# `Evidence` every later stage is judged against — `validity` reads it instead of re-deriving
# where the ticket lands, `design` is handed a blast radius rather than computing one, and each
# acceptance criterion is bound to a `file:line` or refuses the ticket.
#
# Node classes are the point of the file. A `tool` node is deterministic — no model, no network,
# no clock, no RNG — and its output is digested, so "deterministic" is checkable rather than
# asserted. An `agent` node reaches a model. `n_design` is declared an agent node because that is
# the target state; it runs with `llm=None`, and the promotion was measured in 3.20.0 and
# declined (docs/specs/design-promotion-ab-results.md), so it stays deterministic until a
# measurement says otherwise.
#
# `approval_points` is deliberately empty. `autorun` still owns the plan gate and parking, and
# writing gates here that this graph does not enforce would claim governance the profile does
# not provide.

metadata:
  id: sdlc.enhancement
  version: 1.0.0
  description: >-
    The SDLC pipeline for an enhancement — landing sites and blast radius, then design,
    implementation and review. No root-cause analysis; there is no fault to localize.
  tags: [sdlc, enhancement]

status:
  state: published

spec:
  objective: >-
    Take one enhancement from a source document to a reviewed change, grounded in what the
    Product Knowledge Graph already holds.
  workflow_pattern: sequential

  nodes:
    - id: n_intake
      type: agent
      config:
        stage: intake
        summary: Resolve the source to one spec, once, and hand it to every later stage.

    - id: n_investigate
      type: tool
      template_id: sdlc.investigate
      config:
        stage: investigate
        summary: The symbols this ticket lands on, with file:line, kind, callers and module.

    - id: n_blast_radius
      type: tool
      template_id: sdlc.blast_radius
      config:
        stage: blast_radius
        summary: Impact of the landing sites — not of a design's proposal.
        new_in_graph: true

    # The half of `n_rca` an enhancement can actually use. RCA localizes a symptom and a
    # feature has none, so this profile drops that node — and used to drop the `git log`
    # recency pass with it, for half of all tickets. "Is this area moving?" does not depend on
    # a symptom. Keyed off the landing sites rather than a fault site, which makes it the
    # weaker of the two readings: where this ticket's vocabulary already lives is what it will
    # attach to, not what it will touch, so the rendering says that and not "expect a
    # regression". `bug` and `default` keep getting churn through `n_rca`, from the same
    # implementation in `sdlc/churn.py`.
    - id: n_churn
      type: tool
      template_id: sdlc.churn
      config:
        stage: churn
        summary: Which landing files changed in the last 40 commits.

    - id: n_validity
      type: tool
      template_id: sdlc.validity
      config:
        stage: validity
        summary: Judge the ticket against the code. The only step that stops a run before code.

    - id: n_design
      type: agent
      config:
        stage: design
        summary: Approach, interfaces, data changes, test strategy.
        model_today: false
        note: >-
          Declared an agent node because that is the target state. Runs with llm=None today;
          promotion is Phase 2 and requires the design validator to ship first.

    - id: n_implement
      type: agent
      config:
        stage: implement
        summary: Codegen, tests and the refine loop.

    - id: n_review
      type: agent
      config:
        stage: review
        summary: Review the worktree diff, fix what it finds, re-run the tests.

  edges:
    - source: n_intake
      target: n_investigate
    - source: n_investigate
      target: n_blast_radius
    - source: n_blast_radius
      target: n_churn
    - source: n_churn
      target: n_validity
    - source: n_validity
      target: n_design
    - source: n_design
      target: n_implement
    - source: n_implement
      target: n_review

  approval_points: []

  budget:
    max_replan_count: 0
