# Strict gap rules for the requirements-check flow (`openspec check` / `openspec answer`).
#
# The default set (intent_gaps.yaml) runs on every `ingest` and only ever *warns* about the
# why-fields, so adopting Spine never starts blocking a source it used to accept. This set is
# opt-in: it gates on a missing problem, users or outcome, and on any open question with no
# recorded answer (or no named owner it is deferred to).
#
#   blocker     — gates approval
#   needs_input — gates approval
#   warning     — advisory
#
# check kinds: field_present | min_length | min_items | max_items | pattern | question_state
#   pattern        regex (case-insensitive) over a string field, or over any/all items of a list
#                  (mode: any | all). An empty field is not judged. A regex nudges; it never
#                  judges, which is why the pattern rules are warnings.
#   question_state every open_questions entry has a Resolution: answered (not a model proposal)
#                  or deferred with an owner. Replaces open_questions_unresolved.
# fields: title | description | scope | problem | outcome | users | non_goals | nfrs |
#         dependencies | acceptance_criteria | open_questions
#
# Mirrors STRICT_GAP_RULES; tests/intake/test_gap_clarity.py fails if the two drift.

rules:
- id: description_present
  description: Intent must have a real description.
  severity: blocker
  check: min_length
  field: description
  length: 10
- id: scope_declared
  description: Intent should declare what is in / out of scope.
  severity: warning
  check: field_present
  field: scope
- id: nfrs_missing
  description: Intent should list at least one non-functional requirement.
  severity: warning
  check: min_items
  field: nfrs
  count: 1
- id: problem_stated
  description: Intent should state the problem it solves.
  severity: blocker
  check: field_present
  field: problem
- id: users_named
  description: Intent should name who has the problem.
  severity: needs_input
  check: min_items
  field: users
  count: 1
- id: outcome_stated
  description: Intent should state the outcome that means it worked.
  severity: needs_input
  check: field_present
  field: outcome
- id: outcome_observable
  description: 'The outcome should be observable: a number, a threshold, or something a user sees.'
  severity: warning
  check: pattern
  field: outcome
  pattern: \d|%|\b(within|under|below|above|at least|at most|fewer|more than|less than|zero|no longer|reduces?|increases?|decreases?|faster|slower|completes?|receives?|sees?|can|cannot|stops?|returns?|appears?|closes?|reconciles?)\b
- id: non_goal_named
  description: Intent should name at least one thing it will not do.
  severity: warning
  check: min_items
  field: non_goals
  count: 1
- id: criteria_testable
  description: 'Each acceptance criterion should be testable: Given/When/Then, or SHALL + a result.'
  severity: warning
  check: pattern
  field: acceptance_criteria
  pattern: \b(given|when|then|shall|must|should|returns?|rejects?|displays?|shows?|creates?|sends?|logs?|fails?|exits?|prints?|writes?|emits?|records?|stops?|allows?|prevents?|raises?|responds?|redirects?|accepts?|refuses?)\b
  mode: all
- id: questions_resolved
  description: Every open question needs a recorded answer, or an owner it is deferred to.
  severity: needs_input
  check: question_state
  field: open_questions
