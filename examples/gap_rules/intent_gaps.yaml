# Default gap rules for the intent-approval bookend (Block B.3).
#
# Each rule is a predicate over an extracted Intent; when it FAILS, a
# finding fires with the given severity:
#   blocker     — gates approval (intent too incomplete to build)
#   needs_input — gates approval (a human must resolve open questions)
#   warning     — advisory, does not gate
#
# check kinds: field_present | min_length | min_items | max_items | pattern | question_state
# fields:      title | description | scope | problem | outcome | users | non_goals | nfrs |
#              dependencies | acceptance_criteria | open_questions
#
# The last six rules are the requirements-clarity checks. In this default set they are all
# warnings, so they never change what `ingest` gates on; requirements_gaps.yaml is the strict set.
#
# Copy + edit this file and point the analyzer at it to tune the gate for
# your team — no code change required. These mirror DEFAULT_GAP_RULES.

rules:
- id: description_present
  description: Intent must have a real description.
  severity: blocker
  check: min_length
  field: description
  length: 10
- id: scope_declared
  description: Intent should declare what is in / out of scope.
  severity: warning
  check: field_present
  field: scope
- id: open_questions_unresolved
  description: Intent has open questions a human must resolve.
  severity: needs_input
  check: max_items
  field: open_questions
- id: nfrs_missing
  description: Intent should list at least one non-functional requirement.
  severity: warning
  check: min_items
  field: nfrs
  count: 1
- id: problem_stated
  description: Intent should state the problem it solves.
  severity: warning
  check: field_present
  field: problem
- id: users_named
  description: Intent should name who has the problem.
  severity: warning
  check: min_items
  field: users
  count: 1
- id: outcome_stated
  description: Intent should state the outcome that means it worked.
  severity: warning
  check: field_present
  field: outcome
- id: outcome_observable
  description: 'The outcome should be observable: a number, a threshold, or something a user sees.'
  severity: warning
  check: pattern
  field: outcome
  pattern: \d|%|\b(within|under|below|above|at least|at most|fewer|more than|less than|zero|no longer|reduces?|increases?|decreases?|faster|slower|completes?|receives?|sees?|can|cannot|stops?|returns?|appears?|closes?|reconciles?|(?:produces?|yields?|shows?|lists?|says|reports?|displays?) \w+)\b
- id: non_goal_named
  description: Intent should name at least one thing it will not do.
  severity: warning
  check: min_items
  field: non_goals
  count: 1
- id: criteria_testable
  description: 'Each acceptance criterion should be testable: Given/When/Then, or SHALL + a result.'
  severity: warning
  check: pattern
  field: acceptance_criteria
  pattern: \b(given|when|then|shall|must|should|returns?|rejects?|displays?|shows?|creates?|sends?|logs?|fails?|exits?|prints?|writes?|emits?|records?|stops?|allows?|prevents?|raises?|responds?|redirects?|accepts?|refuses?)\b
  mode: all
